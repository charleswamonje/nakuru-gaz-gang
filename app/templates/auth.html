<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Account — Muiruri Gas Delivery</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main><section class="panel"><h1>Muiruri Gas Delivery Account</h1><p>Create an account with your email and a strong password.</p><form id="register" data-url="{{ url_for("main.register") }}"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (12+ chars, upper/lower/number/symbol)" required><button>Create account</button></form><hr><form id="login" data-url="{{ url_for("main.login") }}"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><hr><form id="reset-request" data-url="{{ url_for("main.request_password_reset") }}"><input name="email" type="email" placeholder="Email for password reset" required><button>Request password reset</button></form><p id="result"></p><p><a href="{{ url_for('main.index') }}">Back to website</a></p></section></main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
