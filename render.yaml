services:
  - type: web
    name: nakuru-gaz-gang
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60 --keep-alive 5 --max-requests 500 --max-requests-jitter 50 run:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nakuru-gaz-gang-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOW_DEV_EMAIL_LINK
        value: "false"

databases:
  - name: nakuru-gaz-gang-db
    plan: free
